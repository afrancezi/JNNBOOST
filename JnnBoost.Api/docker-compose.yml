services:
  postgres-licencas:
    image: postgres:16
    container_name: postgres-licencas
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-licencas-data:/var/lib/postgresql/data
    # Sem "ports" aqui de propósito - o banco não fica exposto pra fora,
    # só a API (na mesma rede Docker) consegue falar com ele.

  jnnboost-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jnnboost-api
    restart: unless-stopped
    depends_on:
      - postgres-licencas
    environment:
      DB_CONNECTION_STRING: "Host=postgres-licencas;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "5000:8080"   # ajuste a porta externa conforme sua necessidade

  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: jnnboost-discord-bot
    restart: unless-stopped
    depends_on:
      - jnnboost-api
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      API_URL: "http://jnnboost-api:8080"
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID}
      STATUS_CHANNEL_ID: ${STATUS_CHANNEL_ID}
    # Sem "ports" aqui - o bot só se conecta PARA FORA (Discord + API),
    # ninguém precisa se conectar NELE.

volumes:
  postgres-licencas-data:
