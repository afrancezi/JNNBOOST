services:
  postgres-licencas:
    image: postgres:16
    container_name: postgres-licencas
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-licencas-data:/var/lib/postgresql/data
    # Sem "ports" - o banco nunca fica acessível de fora do Docker,
    # nem pela rede interna, nem pela internet.

  jnnboost-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jnnboost-api
    restart: unless-stopped
    depends_on:
      - postgres-licencas
    environment:
      DB_CONNECTION_STRING: "Host=postgres-licencas;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    # Sem "ports" publicado - só o Caddy fala com ela via rede interna
    # do Docker, e só o bot do Discord fala com ela também via rede
    # interna (nunca pela internet).

  caddy:
    image: caddy:2-alpine
    container_name: jnnboost-caddy
    restart: unless-stopped
    depends_on:
      - jnnboost-api
    ports:
      - "80:80"    # necessário para o desafio HTTP do Let's Encrypt
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config

  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: jnnboost-discord-bot
    restart: unless-stopped
    depends_on:
      - jnnboost-api
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      API_URL: "http://jnnboost-api:8080"
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID}
      STATUS_CHANNEL_ID: ${STATUS_CHANNEL_ID}
    # Sem "ports" - o bot só se conecta PARA FORA (Discord + API via
    # rede interna), ninguém precisa se conectar NELE.

volumes:
  postgres-licencas-data:
  caddy-data:
  caddy-config: